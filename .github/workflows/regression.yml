name: UVVM Regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install GHDL
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl make

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install cocotb
        run: python -m pip install cocotb==2.1.0

      - name: Run regression
        run: make regression
